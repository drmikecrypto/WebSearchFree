services:
  wsf:
    image: ghcr.io/drmikecrypto/websearchfree:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      # Optional: point at your SearXNG instance for higher-quality results
      # WSF_SEARX_URL: http://host.docker.internal:8888
      WSF_SEARX_URL: ${WSF_SEARX_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
